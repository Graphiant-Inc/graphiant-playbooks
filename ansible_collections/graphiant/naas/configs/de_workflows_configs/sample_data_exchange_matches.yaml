# Sample Data Exchange Matches Configuration
# This file demonstrates how to match Data Exchange services to customers
#
# The system will:
# 1. Read match configuration from the 'data_exchange_matches' list
# 2. Resolve customer and service names to IDs
# 3. Use the specified servicePrefixes (user-selected, not all service prefixes)
# 4. POST to v1/extranet/b2b/matches with the payload
#
# Note: You can select specific service prefixes to include in the match.
# This allows fine-grained control over which service prefixes are available to each customer.
#
# "natTranslationMode.peerToPeer.prefixes" here matches the actual API field directly
# (nested one level under the same natTranslationMode wrapper client_to_server services use
# for their NAT pools). Portal UI capture of this exact scenario (customer "FinanceInc" ->
# id 4074, service "de-service-1" -> id 8539), for cross-checking:
#   POST /v1/extranet/b2b/matches
#   {"customerId":4074,"match":{"serviceId":8539,
#     "servicePrefixes":[{"prefix":"10.1.1.0/24","tag":"s-1-prefix1"}],
#     "natTranslationMode":{"peerToPeer":{"prefixes":[
#       {"prefix":"10.101.1.0/24","outsideNatPrefix":"170.101.1.0/24"}]}}}}
#   -> {"matches": [...], "matchId": 6536}
#   GET /v1/extranet/b2b/customers/4074/matches/summary
#   -> {"matches": [{"id":8539,"name":"de-service-1","serviceType":"peering_service",
#        "matchedCustomers":1,"status":"EXTRANET_SERVICE_STATUS_INACTIVE"}]}
#   (per-match status stays INACTIVE even once matched — ACTIVE appears to require a
#   separate acceptance step; see sample_data_exchange_acceptance.yaml)
#
# Note: "nat" (a flat list of {prefix, outsideNatPrefix}) is also still accepted as a
# legacy alternative to "natTranslationMode.peerToPeer.prefixes" — not needed in new configs.

data_exchange_matches:
  - customerName: "FinanceInc"
    serviceName: "de-service-1"
    servicePrefixes:  # Select specific service prefixes to include
      - prefix: "10.1.1.0/24"
        tag: "s-1-prefix1"
    natTranslationMode:
      peerToPeer:
        prefixes:
          - prefix: "10.101.1.0/24"
            outsideNatPrefix: "170.101.1.0/24"
