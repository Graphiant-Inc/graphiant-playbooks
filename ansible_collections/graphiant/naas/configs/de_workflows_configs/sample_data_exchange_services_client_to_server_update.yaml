# Sample Data Exchange Services Update Configuration - Client to Server
# Used with: operation: update_services
#
# 'serviceName' and 'type: "client_to_server"' are required, plus at least one of
# 'policy.prefixTags' or 'policy.natTranslationMode'. Any field left out is read from the
# existing service via the API and preserved as-is. natTranslationMode prefixes keys are
# edge device names, resolved to device IDs the same way as in create_services.
#
# Rules:
# - The service must already exist (use create_services to create new services).
# - Supports --check (dry run) and --diff (preview changes) flags.
#
# Preview changes before applying:
#   ansible-playbook ... --check --diff
# Apply changes:
#   ansible-playbook ...

data_exchange_services:
  - serviceName: "de-partner-to-org-service-1"
    type: "client_to_server"
    policy:
      prefixTags:
        - prefix: "10.48.52.154/31"
      natTranslationMode:
        centralized:
          prefixes:
            "edge-1-sdktest":
              prefixes: ["162.131.7.64/31"]
            "edge-2-sdktest":
              prefixes: ["162.131.7.66/31"]
