---
# Sample Data Exchange Service Acceptance Configuration - Scale Test (100 Acceptances)
# This file demonstrates accepting all Data Exchange service invitations at scale
# Used in Workflow 4: Data Exchange - Accept Invitation (Non-Graphiant Customer)
# Covers all 100 matches from sample_data_exchange_matches_scale.yaml
#
# All configurations are under 'data_exchange_acceptances' key
# Each acceptance uses human-readable names that will be resolved to IDs by the data exchange manager
# POST to v1/extranet/b2b/matches/{matchId}/consumer
#
# Structure mirrors the API request directly under "policy" (sites, natTranslationMode,
# consumerLanSegments, siteToSiteVpn, globalObjectOps) — see sample_data_exchange_acceptance.yaml
# for full field-by-field documentation and old-structure migration instructions. The old flat
# structure (top-level siteInformation/nat/policy-as-a-list/siteToSiteVpn/globalObjectOps) is not
# supported.

data_exchange_acceptances:
- customerName: FinanceBank-001
  serviceName: de-service-scale-001
  policy:
    sites:
    - sites:
      - site-sjc-sdktest
      siteLists: []
    natTranslationMode:
      peerToPeer:
        prefixes:
        - prefix: 10.1.1.0/28
          tag: s-scale-001-prefix1
        - prefix: 10.1.1.16/28
          tag: s-scale-001-prefix2
    consumerLanSegments:
    - lanSegment: FinanceBank-001-lan-segment
      consumerPrefixes:
      - 10.101.0.0/24
    siteToSiteVpn:
      ipsecGatewayPeers:
        name: s2s-FinanceBank-001
        routing:
          static:
            destinationPrefix:
            - 10.101.0.0/24
        remotePeers:
        - name: peer-1
          destinationAddress: 0.0.0.0
          mtu: 1400
          tcpMss: 1360
          remoteIkePeerIdentity: 10.101.0.0
          ikeInitiator: false
          tunnel1:
            insideIpv4Cidr: null
            insideIpv6Cidr: null
            psk: null
            localIkePeerIdentity: null
          tunnel2:
            insideIpv4Cidr: null
            insideIpv6Cidr: null
            psk: null
            localIkePeerIdentity: null
          vpnProfile: vpnprofile-global-test
      region: us-central-1 (Chicago)
      emails:
      - admin001@financebank.com
      - support001@financebank.com
    globalObjectOps: {}
  routingPolicyTable: []
