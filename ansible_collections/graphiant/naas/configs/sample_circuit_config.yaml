# Sample Circuit Configuration for Graphiant Playbooks
# This file demonstrates how to configure circuits for multiple devices
# Includes examples of both IPv4 and IPv6 static routes
#
# Field names are API-aligned camelCase. Legacy snake_case names are still
# accepted as backward-compatible aliases (camelCase wins when both are set):
#   - linkUpSpeedMbps / upload_bandwidth
#   - linkDownSpeedMbps / download_bandwidth
#   - circuitType / circuit_type
#   - diaEnabled / dia
#   - lastResort / last_resort
#   - qosProfile / qos_profile
#   - qosProfileType / qos_profile_type
#   - staticRoutes / static_routes
#   - destinationPrefix / destination_prefix
#   - administrativeDistance / administrative_distance
#   - nextHops / next_hops
#   - nextHopAddress / next_hop_address

circuits:
  # Device 1: edge-1-sdktest
  - edge-1-sdktest:
    # Primary WAN Circuit with DIA enabled
    - circuit: c-gigabitethernet5-0-0
      description: "Primary WAN Circuit"
      linkUpSpeedMbps: 100
      linkDownSpeedMbps: 500
      circuitType: "circuitType_internet"
      label: "internet_dia_2"
      qosProfile: "gold25"
      qosProfileType: "balanced"
      diaEnabled: true
      lastResort: false

    # Secondary WAN Circuit as last resort
    - circuit: c-gigabitethernet6-0-0
      description: "Secondary WAN Circuit"
      linkUpSpeedMbps: 50
      linkDownSpeedMbps: 100
      circuitType: "circuitType_internet"
      label: "internet_dia_2"
      diaEnabled: false
      lastResort: true

  # Device 2: edge-2-sdktest
  - edge-2-sdktest:
    # High-speed WAN Circuit
    - circuit: c-gigabitethernet5-0-0
      description: "High-Speed WAN"
      linkUpSpeedMbps: 500
      linkDownSpeedMbps: 1000
      circuitType: "circuitType_internet"
      label: "internet_dia_2"
      qosProfile: "gold10"
      qosProfileType: "balanced"
      diaEnabled: true
      lastResort: false
      staticRoutes:
        # IPv4 routes
        "10.10.0.0/16":
          destinationPrefix: "10.10.0.0/16"
          description: "private_network"
          administrativeDistance: 2
          nextHops:
            - nextHopAddress: "10.10.0.1"
        # IPv6 routes
        "2001:db8:2::/64":
          destination_prefix: "2001:db8:2::/64"
          description: "ipv6 route"
          administrative_distance: 3
          next_hops:
            - next_hop_address: "2001:db8:2::5"

  # Device 3: edge-3-sdktest
  - edge-3-sdktest:
    # Standard WAN Circuit
    - circuit: c-gigabitethernet5-0-0.1001
      description: "Standard WAN Circuit"
      upload_bandwidth: 100
      download_bandwidth: 500
      circuit_type: "circuitType_internet"
      label: "internet_dia_2"
      qos_profile: "gold25"
      qos_profile_type: "balanced"
      dia: false
      last_resort: false

    # Backup Circuit
    - circuit: c-gigabitethernet5-0-0
      description: "Backup Circuit"
      linkUpSpeedMbps: 100
      linkDownSpeedMbps: 200
      circuitType: "circuitType_internet"
      label: "internet_dia_3"
      qosProfile: "gold25"
      qosProfileType: "balanced"
      diaEnabled: false
      lastResort: true
