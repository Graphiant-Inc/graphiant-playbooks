# Data Assurance configuration
#
# Two kinds of policy, both optional and managed by the same playbook:
#
#   Assurance policy    — assure apps and optimize path selection using a flex-algo.
#                         Listed under DataAssurancePolicies (with flexAlgo).
#
#   Protection policy   — block traffic. Two types:
#                           By URL      — block an app/domain (Threat_Blocked).
#                                         Listed under DataAssurancePolicies (no flexAlgo).
#                           By category — block whole domain categories, with an optional
#                                         allowed-URL list. Listed under ContentFilterPolicies.
#
# Scope each policy with either  useAllSites: true  or  siteListName: SITE_LIST_NAME.
# Just give an app 'name' + 'profileName'; the module validates the name and auto-fills the
# rest (bucketId, isDomain/builtinAppId/customAppId, servers) from the portal.
#
# See the graphiant_data_assurance module docs for the full field reference and profileName list.

DataAssurancePolicies:
  # Assurance policy — optimize path selection using a flex-algo. Scoped to a named site list.
  - name: assurance-policy-1
    useAllSites: true
    lanNames:
      - lan-1-sdktest
      - lan-2-sdktest
      - lan-3-sdktest
      - lan-7-sdktest
    flexAlgo: test-all-cores
    apps:
      - name: tcp
        profileName: General_Assured
        useAllServers: true

  # Assurance policy scoped to all sites. Here 'servers' are given explicitly instead of auto-filled.
  - name: assurance-policy-2
    useAllSites: true
    flexAlgo: test-all-cores
    apps:
      - name: iperf
        profileName: General_Assured
        servers:
          - ip: 10.2.1.2
            port: 5201
            protocol: udp
          - ip: 10.1.1.2
            port: 5201
            protocol: udp

  # Protection policy (By URL) — no flexAlgo; the app 'name' is a domain (isDomain auto-filled).
  - name: block-policy-1
    useAllSites: true
    lanNames:
      - lan-1-sdktest
      - lan-2-sdktest
      - lan-3-sdktest
    apps:
      - name: www.17ebook.com
        profileName: Unsecured_DIA_Risky
        useAllServers: true

ContentFilterPolicies:
  # Protection policy (By category) — block domain categories by name. 'allowedUrlList' is
  # optional and lets specific URLs through despite the block.
  - name: block-gambling-and-malicious
    useAllSites: true
    lanNames:
      - lan-1-sdktest
      - lan-2-sdktest
      - lan-3-sdktest
    categories:
      - Gambling
      - Malicious
    allowedUrlList:
      - "*.trusted-partner.com"
      - "lottery.internal.example.com"
