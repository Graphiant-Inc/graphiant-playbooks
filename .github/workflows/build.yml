name: Build Collection

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'ansible_collections/graphiant/naas/**'
      - '.github/workflows/build.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'ansible_collections/graphiant/naas/**'
      - '.github/workflows/build.yml'
  schedule:
    # Run weekly on Monday at 3 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  build:
    name: Build Collection
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible_collections/graphiant/naas
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Install dependencies
        run: |
          pip install -r requirements-ee.txt

      - name: Create build directory
        run: |
          mkdir -p ${{ github.workspace }}/build

      - name: Build collection
        run: |
          python ${{ github.workspace }}/scripts/build_collection.py

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: collection-tarball
          path: ${{ github.workspace }}/build/graphiant-naas-*.tar.gz
          retention-days: 7

      - name: Verify build artifact exists
        run: |
          COLLECTION_FILE=$(ls ${{ github.workspace }}/build/graphiant-naas-*.tar.gz | head -1)
          if [ -z "$COLLECTION_FILE" ] || [ ! -f "$COLLECTION_FILE" ]; then
            echo "Error: Collection file not found in build directory"
            exit 1
          fi
          echo "✅ Collection built successfully: $COLLECTION_FILE"

